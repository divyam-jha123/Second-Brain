name: brainexpo-dev

services:
  mongo:
    image: mongo:latest
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-latest-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: ./brainly-backend
      target: dev
    image: ${BRAINEXPO_API_IMAGE:-divyamjha/brainexpo-api:version1.0}
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 8000
      MONGO_URI: mongodb://mongo:27017/brainly
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-sk_test_BCXDlzukko4ngKqXLZwGBByJ98CvB6VrKuqVRwOh04}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-pk_test_Z3JhbmQtY2xhbS0xMy5jbGVyay5hY2NvdW50cy5kZXYk}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-BrainExpo <onboarding@resend.dev>}
      UNSUBSCRIBE_SECRET: ${UNSUBSCRIBE_SECRET:-local-dev-unsubscribe-secret}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "8000:8000"
    volumes:
      - ./brainly-backend/src:/app/src:ro
      - ./brainly-backend/tsconfig.json:/app/tsconfig.json:ro
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      disable: true

  web:
    build:
      context: ./brainly-frontend
      target: dev
    image: ${BRAINEXPO_WEB_IMAGE:-divyamjha/brainexpo-web:version1.0}
    restart: unless-stopped
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:8000}
      VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-pk_test_Z3JhbmQtY2xhbS0xMy5jbGVyay5hY2NvdW50cy5kZXYk}
      VITE_EXTENSION_ID: ${VITE_EXTENSION_ID:-}
      VITE_SUPPORT_EMAIL: ${VITE_SUPPORT_EMAIL:-contact@brainexpo.me}
    ports:
      - "5173:5173"
    volumes:
      - ./brainly-frontend:/app
      - web-node-modules:/app/node_modules
    depends_on:
      - api
    command: npm run dev -- --host 0.0.0.0 --port 5173

  extension:
    profiles:
      - extension
    build:
      context: ./brainly-extension
      target: dev
    image: ${BRAINEXPO_EXTENSION_IMAGE:-brainexpo-extension:dev}
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: ${VITE_EXTENSION_API_URL:-http://localhost:8000}
      VITE_FRONTEND_URL: ${VITE_EXTENSION_FRONTEND_URL:-http://localhost:5173}
    ports:
      - "5174:5174"
    volumes:
      - ./brainly-extension:/app
      - extension-node-modules:/app/node_modules
    depends_on:
      - api
      - web
    command: npm run dev -- --host 0.0.0.0 --port 5174

volumes:
  mongo-latest-data:
  web-node-modules:
  extension-node-modules:
